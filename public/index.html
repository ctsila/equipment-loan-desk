<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Equipment Desk</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <div class="brand"><span class="mark" aria-hidden="true">IT</span> Equipment Desk</div>
      <label class="account">Demo account <select id="account" aria-label="Demo account"></select></label>
    </div>
  </header>
  <main>
    <div class="page-heading">
      <div>
        <p id="workspace" class="workspace"></p>
        <h1 id="page-title">Request equipment</h1>
        <p id="description" class="description"></p>
      </div>
      <p id="usage" class="usage"></p>
    </div>
    <p id="message" role="status" hidden></p>
    <div id="workspace-grid" class="grid">
      <section id="employee-panel" class="panel" aria-labelledby="form-title" hidden>
        <h2 id="form-title">New request</h2>
        <p id="route" class="muted"></p>
        <form id="request-form">
          <label class="field">Equipment <select required name="equipment" id="equipment"></select></label>
          <div class="two-fields">
            <label class="field">Full name <input required name="employee_name" maxlength="80" autocomplete="off"></label>
            <label class="field">Employee ID <input required name="employee_id" maxlength="20" autocomplete="off"></label>
          </div>
          <label class="field">Office <select required name="office" id="office"></select></label>
          <label class="field">Reason for the request
            <textarea required name="reason" minlength="15" maxlength="300" rows="3" aria-describedby="reason-help"></textarea>
          </label>
          <p id="reason-help" class="field-hint">Explain what you need the equipment for. Use 15–300 characters.</p>
          <button type="submit" class="primary">Submit request</button>
        </form>
      </section>
      <section class="panel requests" aria-labelledby="queue-title">
        <h2 id="queue-title">My requests</h2>
        <div id="request-list"></div>
      </section>
    </div>
  </main>
</body>
</html>
